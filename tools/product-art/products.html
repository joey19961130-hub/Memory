<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<title>Product art</title>
<style>body{margin:0;background:#222}canvas{width:600px;height:600px;margin:4px}</style>
</head>
<body>
<canvas id="c" width="1200" height="1200"></canvas>
<script>
/*
 * Illustrated demo product shots (placeholder catalogue photos until real photos are uploaded).
 * window.draw(productKey, view) renders one shot; views: 0 = hero, 1 = alternate, 2 = close-up.
 */
const S = 1200;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const TAU = Math.PI * 2;
const NAVY = '#1D3045';

function studio(c, top, bottom) {
  const g = c.createLinearGradient(0, 0, 0, S);
  g.addColorStop(0, top); g.addColorStop(1, bottom);
  c.fillStyle = g; c.fillRect(0, 0, S, S);
  // soft light spill
  const r = c.createRadialGradient(S * 0.35, S * 0.25, 0, S * 0.35, S * 0.25, S * 0.8);
  r.addColorStop(0, 'rgba(255,255,255,0.45)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = r; c.fillRect(0, 0, S, S);
}
function shadow(c, x, y, w, h, a = 0.22) {
  c.save();
  c.filter = 'blur(28px)';
  c.fillStyle = `rgba(29,48,69,${a})`;
  c.beginPath(); c.ellipse(x, y, w, h, 0, 0, TAU); c.fill();
  c.restore();
}
function gold(c, x0, y0, x1, y1) {
  const g = c.createLinearGradient(x0, y0, x1, y1);
  g.addColorStop(0, '#8C6A2E'); g.addColorStop(0.3, '#F3D98B'); g.addColorStop(0.55, '#B8913F'); g.addColorStop(0.8, '#F6E2A4'); g.addColorStop(1, '#8C6A2E');
  return g;
}
function heart(c, s) {
  c.beginPath();
  c.moveTo(0, s * 0.42);
  c.bezierCurveTo(-s * 1.1, -s * 0.2, -s * 0.5, -s * 1.0, 0, -s * 0.45);
  c.bezierCurveTo(s * 0.5, -s * 1.0, s * 1.1, -s * 0.2, 0, s * 0.42);
  c.closePath();
}
function star(c, r, n = 5, inner = 0.45) {
  c.beginPath();
  for (let i = 0; i <= n * 2; i++) {
    const a = (i / (n * 2)) * TAU - Math.PI / 2, rr = i % 2 ? r * inner : r;
    i ? c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : c.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  c.closePath();
}
function rr(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

// ---------- 1. acrylic charm ----------
function charm(c, angle = 0, squash = 1) {
  c.save();
  c.translate(600, 640); c.rotate(angle); c.scale(squash * 1.45, 1.45); c.translate(0, -40);
  // chain
  for (let i = 0; i < 9; i++) {
    c.save(); c.translate(0, -420 + i * 30); c.rotate(i % 2 ? 0 : Math.PI / 2);
    c.strokeStyle = gold(c, -12, -12, 12, 12); c.lineWidth = 7;
    c.beginPath(); c.ellipse(0, 0, 16, 9, 0, 0, TAU); c.stroke(); c.restore();
  }
  // jump ring
  c.strokeStyle = gold(c, -30, -190, 30, -130); c.lineWidth = 12;
  c.beginPath(); c.arc(0, -160, 30, 0, TAU); c.stroke();
  // acrylic body with thickness
  c.save(); c.translate(10, 14); heart(c, 330); c.fillStyle = 'rgba(29,48,69,0.12)'; c.fill(); c.restore();
  heart(c, 330);
  const g = c.createLinearGradient(-300, -300, 300, 300);
  g.addColorStop(0, 'rgba(255,255,255,0.92)'); g.addColorStop(1, 'rgba(255,255,255,0.7)');
  c.fillStyle = g; c.fill();
  c.lineWidth = 6; c.strokeStyle = 'rgba(255,255,255,0.95)'; c.stroke();
  // printed artwork
  c.save(); heart(c, 290); c.clip();
  c.fillStyle = '#F7E3DE'; c.fillRect(-400, -400, 800, 800);
  const petals = ['#E9B8B0', '#F1D58A', '#A9C1A6', '#B9AEDC', '#A8C6DD'];
  for (let i = 0; i < 5; i++) {
    c.save(); c.translate(0, -40); c.rotate((i / 5) * TAU); c.fillStyle = petals[i];
    c.beginPath(); c.ellipse(0, -70, 46, 78, 0, 0, TAU); c.fill(); c.restore();
  }
  c.fillStyle = '#F1D58A'; c.beginPath(); c.arc(0, -40, 40, 0, TAU); c.fill();
  c.fillStyle = NAVY; c.beginPath(); c.arc(-12, -46, 6, 0, TAU); c.arc(12, -46, 6, 0, TAU); c.fill();
  c.strokeStyle = NAVY; c.lineWidth = 4; c.beginPath(); c.arc(0, -36, 12, 0.2, Math.PI - 0.2); c.stroke();
  for (const [x, y, r] of [[-170, -160, 18], [170, -150, 14], [-120, 120, 12], [140, 90, 16]]) {
    c.save(); c.translate(x, y); c.fillStyle = '#E8806B'; star(c, r); c.fill(); c.restore();
  }
  c.restore();
  // glare
  c.save(); heart(c, 330); c.clip();
  c.fillStyle = 'rgba(255,255,255,0.55)';
  c.beginPath(); c.moveTo(-320, -200); c.lineTo(-200, -320); c.lineTo(-40, 300); c.lineTo(-160, 300); c.closePath(); c.fill();
  c.restore();
  // hole
  c.fillStyle = 'rgba(255,255,255,0.0)';
  c.strokeStyle = 'rgba(29,48,69,0.25)'; c.lineWidth = 3; c.beginPath(); c.arc(0, -150, 14, 0, TAU); c.stroke();
  c.restore();
}

// ---------- 2. fragrance sachet ----------
function sachet(c, x, y, s, ribbon = '#E8806B') {
  c.save(); c.translate(x, y); c.scale(s, s);
  // pouch
  c.beginPath();
  c.moveTo(-170, -120); c.quadraticCurveTo(-210, 180, -190, 250); c.quadraticCurveTo(0, 290, 190, 250);
  c.quadraticCurveTo(210, 180, 170, -120); c.closePath();
  const g = c.createLinearGradient(-200, 0, 200, 0);
  g.addColorStop(0, '#E9E1D2'); g.addColorStop(0.5, '#F8F3EA'); g.addColorStop(1, '#DCD2C0');
  c.fillStyle = g; c.fill();
  c.save(); c.clip();
  c.strokeStyle = 'rgba(120,100,70,0.08)'; c.lineWidth = 2;
  for (let i = -300; i < 300; i += 9) { c.beginPath(); c.moveTo(i, -200); c.lineTo(i, 320); c.stroke(); c.beginPath(); c.moveTo(-300, i); c.lineTo(300, i); c.stroke(); }
  // printed sprig
  c.strokeStyle = '#7E9A7A'; c.lineWidth = 5;
  c.beginPath(); c.moveTo(0, 210); c.quadraticCurveTo(10, 100, -10, 10); c.stroke();
  c.fillStyle = '#9D8FCB';
  for (let i = 0; i < 9; i++) { c.beginPath(); c.ellipse(-8 + (i % 2 ? 12 : -12), 30 + i * 18, 11, 8, 0, 0, TAU); c.fill(); }
  c.restore();
  // gathered neck
  c.fillStyle = '#E2D8C6';
  c.beginPath(); c.moveTo(-150, -110); c.lineTo(-120, -230); c.quadraticCurveTo(0, -260, 120, -230); c.lineTo(150, -110); c.closePath(); c.fill();
  c.strokeStyle = 'rgba(120,100,70,0.25)'; c.lineWidth = 3;
  for (let i = -100; i <= 100; i += 40) { c.beginPath(); c.moveTo(i, -115); c.lineTo(i * 0.8, -230); c.stroke(); }
  // ribbon + bow
  c.fillStyle = ribbon; rr(c, -160, -135, 320, 34, 12); c.fill();
  for (const d of [-1, 1]) {
    c.beginPath(); c.moveTo(0, -118); c.bezierCurveTo(d * 60, -200, d * 140, -170, d * 110, -110); c.bezierCurveTo(d * 90, -80, d * 40, -100, 0, -118); c.fill();
    c.beginPath(); c.moveTo(0, -110); c.quadraticCurveTo(d * 50, -40, d * 80, 10); c.lineTo(d * 60, 18); c.quadraticCurveTo(d * 30, -40, 0, -100); c.fill();
  }
  c.fillStyle = 'rgba(0,0,0,0.12)'; c.beginPath(); c.arc(0, -116, 18, 0, TAU); c.fill();
  c.restore();
}

// ---------- 3. gift box ----------
function giftBox(c, x, y, s, body = NAVY, ribbon = '#E9B8B0') {
  c.save(); c.translate(x, y); c.scale(s, s);
  const w = 300, d = 150, h = 230;
  // front
  c.fillStyle = body; c.beginPath(); c.moveTo(-w / 2, 0); c.lineTo(w / 2 - 40, 40); c.lineTo(w / 2 - 40, 40 + h); c.lineTo(-w / 2, h); c.closePath(); c.fill();
  // side
  c.fillStyle = shade(body, -0.25); c.beginPath(); c.moveTo(w / 2 - 40, 40); c.lineTo(w / 2 + d - 40, -20); c.lineTo(w / 2 + d - 40, h - 20); c.lineTo(w / 2 - 40, 40 + h); c.closePath(); c.fill();
  // lid top
  c.fillStyle = shade(body, 0.18); c.beginPath(); c.moveTo(-w / 2 - 12, -6); c.lineTo(-w / 2 + d - 30, -66); c.lineTo(w / 2 + d - 28, -26); c.lineTo(w / 2 - 28, 36); c.closePath(); c.fill();
  // ribbon front & side
  c.fillStyle = ribbon;
  c.beginPath(); c.moveTo(-20, 10); c.lineTo(20, 17); c.lineTo(20, 17 + h); c.lineTo(-20, h + 10); c.closePath(); c.fill();
  c.fillStyle = shade(ribbon, -0.15);
  c.beginPath(); c.moveTo(w / 2 - 40, 40 + h * 0.45); c.lineTo(w / 2 + d - 40, -20 + h * 0.45); c.lineTo(w / 2 + d - 40, -20 + h * 0.45 + 34); c.lineTo(w / 2 - 40, 40 + h * 0.45 + 34); c.closePath(); c.fill();
  c.fillStyle = shade(ribbon, 0.1);
  c.beginPath(); c.moveTo(-10, -2); c.lineTo(80, -40); c.lineTo(110, -34); c.lineTo(20, 6); c.closePath(); c.fill();
  // bow
  c.fillStyle = ribbon;
  for (const dd of [-1, 1]) {
    c.beginPath(); c.moveTo(40, -20); c.bezierCurveTo(40 + dd * 70, -120, 40 + dd * 150, -60, 40 + dd * 100, -10); c.bezierCurveTo(40 + dd * 70, 10, 40 + dd * 30, -5, 40, -20); c.fill();
  }
  c.fillStyle = shade(ribbon, -0.2); c.beginPath(); c.arc(40, -22, 18, 0, TAU); c.fill();
  // tag
  c.save(); c.translate(-w / 2 + 40, 90); c.rotate(-0.2);
  c.fillStyle = '#FBF7EE'; rr(c, -40, 0, 80, 110, 8); c.fill();
  c.fillStyle = '#E8806B'; c.beginPath(); c.arc(0, 55, 14, 0, TAU); c.fill();
  c.strokeStyle = 'rgba(29,48,69,0.4)'; c.lineWidth = 2; c.beginPath(); c.arc(0, 14, 5, 0, TAU); c.stroke();
  c.restore();
  c.restore();
}
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const f = (v) => Math.max(0, Math.min(255, Math.round(k > 0 ? v + (255 - v) * k : v * (1 + k))));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}

// ---------- 4. enamel pin ----------
function pin(c, x, y, s, tilt = 0) {
  c.save(); c.translate(x, y); c.rotate(tilt); c.scale(s, s);
  // depth
  c.fillStyle = '#7A5B23'; c.beginPath(); c.arc(8, 12, 230, 0, TAU); c.fill();
  c.fillStyle = gold(c, -230, -230, 230, 230); c.beginPath(); c.arc(0, 0, 230, 0, TAU); c.fill();
  c.save(); c.beginPath(); c.arc(0, 0, 205, 0, TAU); c.clip();
  c.fillStyle = NAVY; c.fillRect(-250, -250, 500, 500);
  // hills
  c.fillStyle = '#A9C1A6'; c.beginPath(); c.moveTo(-250, 120); c.quadraticCurveTo(-80, 40, 60, 110); c.quadraticCurveTo(160, 160, 250, 90); c.lineTo(250, 250); c.lineTo(-250, 250); c.fill();
  c.fillStyle = '#7E9A7A'; c.beginPath(); c.moveTo(-250, 170); c.quadraticCurveTo(0, 110, 250, 180); c.lineTo(250, 250); c.lineTo(-250, 250); c.fill();
  // moon
  c.fillStyle = '#F1D58A'; c.beginPath(); c.arc(-30, -50, 95, 0, TAU); c.fill();
  c.fillStyle = NAVY; c.beginPath(); c.arc(15, -80, 85, 0, TAU); c.fill();
  c.fillStyle = '#F1D58A';
  for (const [sx, sy, r] of [[100, -120, 20], [140, -20, 12], [-140, -140, 10], [60, 10, 9]]) { c.save(); c.translate(sx, sy); star(c, r, 4, 0.35); c.fill(); c.restore(); }
  c.restore();
  // gold dividers
  c.strokeStyle = gold(c, -200, -200, 200, 200); c.lineWidth = 7;
  c.beginPath(); c.arc(0, 0, 206, 0, TAU); c.stroke();
  // gloss
  c.fillStyle = 'rgba(255,255,255,0.18)'; c.beginPath(); c.ellipse(-70, -110, 120, 50, -0.6, 0, TAU); c.fill();
  c.restore();
}
function pinCard(c) {
  c.save(); c.translate(600, 620); c.rotate(-0.05);
  shadow(c, 20, 30, 330, 420, 0.25);
  c.fillStyle = '#FBF8F1'; rr(c, -300, -400, 600, 800, 18); c.fill();
  c.fillStyle = 'rgba(29,48,69,0.06)'; for (let i = -380; i < 400; i += 26) c.fillRect(-300, i, 600, 2);
  c.fillStyle = NAVY; c.font = '600 34px Inter, sans-serif'; c.textAlign = 'center'; c.fillText('ENAMEL PIN', 0, 300);
  c.fillStyle = '#E8806B'; c.fillRect(-40, 330, 80, 4);
  c.restore();
}

// ---------- 5. plush bear ----------
function bear(c, x, y, s, tilt = 0, hug = false) {
  c.save(); c.translate(x, y); c.scale(s, s);
  const fur = (cx, cy, r, base) => {
    const g = c.createRadialGradient(cx - r * 0.3, cy - r * 0.35, r * 0.1, cx, cy, r);
    g.addColorStop(0, shade(base, 0.25)); g.addColorStop(1, shade(base, -0.12));
    return g;
  };
  const B = '#EBD9C2';
  // legs & body
  c.fillStyle = fur(0, 230, 230, B); c.beginPath(); c.ellipse(0, 220, 200, 210, 0, 0, TAU); c.fill();
  for (const d of [-1, 1]) { c.fillStyle = fur(d * 120, 400, 90, B); c.beginPath(); c.ellipse(d * 120, 400, 95, 70, 0, 0, TAU); c.fill(); c.fillStyle = '#F6E9D7'; c.beginPath(); c.ellipse(d * 120, 410, 50, 38, 0, 0, TAU); c.fill(); }
  // belly
  c.fillStyle = '#F6E9D7'; c.beginPath(); c.ellipse(0, 250, 110, 120, 0, 0, TAU); c.fill();
  // scarf
  c.fillStyle = '#E8806B'; rr(c, -150, 30, 300, 56, 26); c.fill();
  c.beginPath(); c.moveTo(70, 70); c.lineTo(130, 200); c.lineTo(80, 210); c.lineTo(40, 80); c.fill();
  c.strokeStyle = 'rgba(255,255,255,0.5)'; c.lineWidth = 4; c.setLineDash([10, 10]); c.beginPath(); c.moveTo(-130, 58); c.lineTo(130, 58); c.stroke(); c.setLineDash([]);
  // arms
  for (const d of [-1, 1]) {
    c.save(); c.translate(d * 175, 180); c.rotate(d * (hug ? -0.9 : 0.35));
    c.fillStyle = fur(0, 0, 80, B); c.beginPath(); c.ellipse(0, 50, 62, 110, 0, 0, TAU); c.fill(); c.restore();
  }
  if (hug) { c.save(); c.translate(0, 210); c.fillStyle = '#E9B8B0'; heart(c, 110); c.fill(); c.restore(); }
  // head
  c.save(); c.rotate(tilt);
  for (const d of [-1, 1]) { c.fillStyle = fur(d * 150, -260, 80, B); c.beginPath(); c.arc(d * 150, -250, 78, 0, TAU); c.fill(); c.fillStyle = '#E9B8B0'; c.beginPath(); c.arc(d * 150, -250, 42, 0, TAU); c.fill(); }
  c.fillStyle = fur(0, -120, 230, B); c.beginPath(); c.ellipse(0, -120, 230, 205, 0, 0, TAU); c.fill();
  c.fillStyle = '#F6E9D7'; c.beginPath(); c.ellipse(0, -60, 95, 72, 0, 0, TAU); c.fill();
  c.fillStyle = NAVY; c.beginPath(); c.ellipse(0, -88, 30, 20, 0, 0, TAU); c.fill();
  c.strokeStyle = NAVY; c.lineWidth = 6; c.lineCap = 'round';
  c.beginPath(); c.moveTo(0, -68); c.lineTo(0, -45); c.moveTo(0, -45); c.quadraticCurveTo(-22, -28, -36, -42); c.moveTo(0, -45); c.quadraticCurveTo(22, -28, 36, -42); c.stroke();
  for (const d of [-1, 1]) {
    c.fillStyle = NAVY; c.beginPath(); c.arc(d * 85, -150, 22, 0, TAU); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(d * 85 - 7, -158, 7, 0, TAU); c.fill();
    c.fillStyle = 'rgba(232,128,107,0.35)'; c.beginPath(); c.ellipse(d * 135, -80, 34, 20, 0, 0, TAU); c.fill();
  }
  c.restore();
  c.restore();
}

const PRODUCTS = {
  charm: [
    () => { studio(ctx, '#F7E4E0', '#EDCFC8'); shadow(ctx, 600, 1060, 330, 44); charm(ctx); },
    () => { studio(ctx, '#F2E8E2', '#E2D2C9'); shadow(ctx, 640, 1060, 290, 40); charm(ctx, -0.22, 0.82); },
    () => { studio(ctx, '#F7E4E0', '#EDCFC8'); ctx.save(); ctx.translate(600, 600); ctx.scale(1.5, 1.5); ctx.translate(-600, -600); charm(ctx); ctx.restore(); },
  ],
  sachet: [
    () => { studio(ctx, '#E5EEE2', '#CCDDC8'); shadow(ctx, 600, 1000, 300, 44); sachet(ctx, 600, 640, 1.25); },
    () => { studio(ctx, '#EEF1E6', '#D6E0CE'); shadow(ctx, 560, 990, 360, 46); sachet(ctx, 760, 600, 0.95, '#B9AEDC'); sachet(ctx, 470, 680, 1.15); },
    () => { studio(ctx, '#E5EEE2', '#CCDDC8'); ctx.save(); ctx.translate(600, 600); ctx.scale(2.1, 2.1); ctx.translate(-600, -520); sachet(ctx, 600, 640, 1.25); ctx.restore(); },
  ],
  box: [
    () => { studio(ctx, '#F8EDCB', '#EBD9A6'); shadow(ctx, 640, 960, 330, 50); giftBox(ctx, 540, 600, 1.35); },
    () => { studio(ctx, '#F7F0DA', '#E7DDBB'); shadow(ctx, 600, 990, 380, 50); giftBox(ctx, 520, 650, 1.1, '#E9B8B0', '#1D3045'); giftBox(ctx, 560, 380, 0.75, '#A9C1A6', '#F7F1E6'); },
    () => { studio(ctx, '#F8EDCB', '#EBD9A6'); ctx.save(); ctx.translate(600, 600); ctx.scale(2, 2); ctx.translate(-660, -560); giftBox(ctx, 540, 600, 1.35); ctx.restore(); },
  ],
  pin: [
    () => { studio(ctx, '#ECE7F6', '#D8D0EC'); pinCard(ctx); pin(ctx, 600, 520, 0.95); },
    () => { studio(ctx, '#E9E6F2', '#D2CBE6'); shadow(ctx, 620, 960, 300, 50); pin(ctx, 600, 600, 1.45, -0.25); },
    () => { studio(ctx, '#ECE7F6', '#D8D0EC'); ctx.save(); ctx.translate(600, 600); ctx.scale(2.3, 2.3); ctx.translate(-560, -520); pin(ctx, 600, 520, 0.95); ctx.restore(); },
  ],
  bear: [
    () => { studio(ctx, '#E1ECF4', '#C9DCEA'); shadow(ctx, 600, 1060, 300, 50); bear(ctx, 600, 560, 1.05); },
    () => { studio(ctx, '#E6EEF5', '#CFDDE9'); shadow(ctx, 600, 1060, 300, 50); bear(ctx, 600, 560, 1.05, -0.18, true); },
    () => { studio(ctx, '#E1ECF4', '#C9DCEA'); ctx.save(); ctx.translate(600, 600); ctx.scale(2, 2); ctx.translate(-600, -430); bear(ctx, 600, 560, 1.05); ctx.restore(); },
  ],
};
window.PRODUCTS = Object.fromEntries(Object.entries(PRODUCTS).map(([k, v]) => [k, v.length]));
window.draw = (key, view) => { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, S, S); PRODUCTS[key][view](); return cv.toDataURL('image/webp', 0.86); };
if (!location.search.includes('render')) window.draw('bear', 0);
</script>
</body>
</html>
